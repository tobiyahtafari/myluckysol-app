name: Generate Release Keystore

# Run this ONCE to generate your signing keystore.
# After running, save the outputs as GitHub Secrets and DELETE this workflow.

on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: 'Key alias (e.g. myluckysol)'
        required: true
        default: 'myluckysol'
      store_password:
        description: 'Keystore password (save this securely!)'
        required: true
      key_password:
        description: 'Key password (save this securely!)'
        required: true
      organization:
        description: 'Organization name'
        required: true
        default: 'MyLuckySol Foundation'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate keystore
        run: |
          keytool -genkey -v \
            -keystore myluckysol-release.jks \
            -alias "${{ github.event.inputs.key_alias }}" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "${{ github.event.inputs.store_password }}" \
            -keypass "${{ github.event.inputs.key_password }}" \
            -dname "CN=${{ github.event.inputs.organization }}, OU=Mobile, O=${{ github.event.inputs.organization }}, L=Remote, ST=Remote, C=US"

      - name: Print base64 keystore
        run: |
          echo "==================================================="
          echo "  COPY THIS AS YOUR KEYSTORE_BASE64 GITHUB SECRET  "
          echo "==================================================="
          base64 -w 0 myluckysol-release.jks
          echo ""
          echo "==================================================="

      - name: Print SHA-256 fingerprint
        run: |
          echo "==================================================="
          echo "  SHA-256 fingerprint (for assetlinks.json)  "
          echo "==================================================="
          keytool -list -v \
            -keystore myluckysol-release.jks \
            -alias "${{ github.event.inputs.key_alias }}" \
            -storepass "${{ github.event.inputs.store_password }}" \
            | grep "SHA256"

      - name: Upload keystore as artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: myluckysol-release-keystore
          path: myluckysol-release.jks
          retention-days: 1
