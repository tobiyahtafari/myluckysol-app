name: Build MyLuckySol APK

on:
  push:
    branches: [main, master]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      # ── Debug APK (no signing — good for sideload testing on Seeker) ─────────
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename debug APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             android/app/build/outputs/apk/debug/MyLuckySol-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MyLuckySol-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/MyLuckySol-debug.apk
          retention-days: 90

      # ── Release APK (signed — required for Solana dApp Store submission) ─────
      - name: Decode keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app/build
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/build/keystore.jks

      - name: Build release APK
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Rename release APK
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk \
             android/app/build/outputs/apk/release/MyLuckySol-release.apk

      - name: Upload release APK
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: MyLuckySol-release-${{ github.sha }}
          path: android/app/build/outputs/apk/release/MyLuckySol-release.apk
          retention-days: 90

      # ── Print signing fingerprint (needed for assetlinks.json) ───────────────
      - name: Print certificate SHA-256 fingerprint
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "=== SHA-256 Fingerprint for assetlinks.json ==="
          keytool -list -v \
            -keystore android/app/build/keystore.jks \
            -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" \
            | grep "SHA256"
